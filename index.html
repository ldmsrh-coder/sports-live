<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스포츠 라이브 | 실시간 경기 점수</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--line:#293650;--muted:#9aa9c2;--accent:#62e6b3;--blue:#7aa7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:28px 18px 22px;background:linear-gradient(135deg,#132943,#101528);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:auto}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}header p{margin:0;color:#c4d0e4}.live{color:var(--accent);font-weight:800}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:22px 0}input,select,button{font:inherit;color:#f4f7ff;background:#111a2d;border:1px solid #344461;border-radius:11px;padding:12px;min-width:0}button{cursor:pointer;background:#1d3e4a;border-color:#2f806e;font-weight:700}button:hover{filter:brightness(1.15)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);margin:10px 0 14px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}.game{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:14px}.teams{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.team{font-weight:700;overflow-wrap:anywhere}.score{font-size:22px;font-weight:850;white-space:nowrap}.status{color:var(--accent);font-size:12px;font-weight:700}.empty,.notice{padding:22px;border:1px dashed #3a4964;border-radius:14px;color:var(--muted);line-height:1.6}.notice{margin-bottom:14px}.small{font-size:12px;color:var(--muted);margin:22px 0}.error{color:#ffb7b7}a{color:#9fc0ff}
</style></head>
<body><header><div class="wrap"><h1>🏟️ 스포츠 라이브</h1><p><span class="live">● LIVE</span> 무료 경기 점수와 일정 · 날짜별 경기 검색</p></div></header>
<main class="wrap" style="padding:0 18px 30px">
<div class="controls">
<label>날짜<br><input id="date" type="date" style="width:100%;margin-top:6px"></label>
<label>종목<br><select id="sport" style="width:100%;margin-top:6px"><option value="football">축구</option><option value="basketball">농구</option><option value="tennis">테니스</option><option value="cricket">크리켓</option></select></label>
<label>팀 / 선수 / 리그 검색<br><input id="q" placeholder="예: 한국, Arsenal, NBA" style="width:100%;margin-top:6px"></label>
<button id="load" style="align-self:end">경기 불러오기</button>
</div>
<div class="bar"><span id="summary">경기 데이터를 불러오는 중…</span><span id="updated"></span></div>
<div id="notice" class="notice">선택한 날짜의 경기 정보를 무료 데이터 제공처에서 가져옵니다. 데이터 제공 여부는 종목과 대회에 따라 다를 수 있습니다.</div>
<div id="games" class="games"></div>
<p class="small">점수 데이터 제공: <a href="https://sportscore.com/" target="_blank" rel="noopener">SportScore</a>. 경기 데이터는 제공처의 업데이트 상태에 따라 지연되거나 일부 누락될 수 있습니다. 이 사이트는 베팅 금액이나 베팅 추적 기능을 제공하지 않습니다.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const now=new Date();const localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=localDate;
let allGames=[];
function val(obj,keys,fallback=''){for(const k of keys){const v=k.split('.').reduce((a,b)=>a&&a[b],obj);if(v!==undefined&&v!==null&&v!=='')return v}return fallback}
function text(v){if(typeof v==='object'&&v!==null)return v.name||v.title||v.short_name||'';return v==null?'':String(v)}
function normalize(raw){let arr=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.data)?raw.data:(raw&&Array.isArray(raw.results)?raw.results:(raw&&Array.isArray(raw.fixtures)?raw.fixtures:[])));return arr.map(g=>{let home=text(val(g,['home_team','home','teams.home','participants.0','competitors.0'],'홈 팀'));let away=text(val(g,['away_team','away','teams.away','participants.1','competitors.1'],'원정 팀'));let hs=val(g,['home_score','scores.home','score.home','scores.0.score','result.home','homeScore'],'-');let as=val(g,['away_score','scores.away','score.away','scores.1.score','result.away','awayScore'],'-');if(typeof hs==='object')hs=hs.current??hs.goals??hs.score??'-';if(typeof as==='object')as=as.current??as.goals??as.score??'-';return {raw:g,home,away,hs,as,league:text(val(g,['league','competition','tournament.name','league.name'],'대회 정보 없음')),status:text(val(g,['status','status.type','state','time.status'],'일정')),time:text(val(g,['starting_at','start_time','date','scheduled_at','time'],'시간 미정'))}})}
async function load(){const date=$('date').value||localDate,sport=$('sport').value;const btn=$('load');btn.disabled=true;btn.textContent='불러오는 중…';$('games').innerHTML='';$('summary').textContent='경기 정보를 요청하고 있어요…';$('notice').classList.remove('error');$('notice').textContent='데이터 제공처에 연결 중입니다. 처음 불러올 때 잠시 걸릴 수 있어요.';
try{const url='https://sportscore.com/api/v1/fixtures/?sport='+encodeURIComponent(sport)+'&date='+encodeURIComponent(date)+'&limit=200';const res=await fetch(url,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('데이터 제공처 응답 '+res.status);const data=await res.json();allGames=normalize(data);render();$('updated').textContent='확인: '+new Date().toLocaleTimeString('ko-KR');$('notice').textContent='데이터 제공: SportScore · 일부 종목/리그/유소년 경기는 제공되지 않을 수 있습니다.';}catch(e){allGames=[];$('summary').textContent='경기 데이터를 가져오지 못했어요.';$('notice').classList.add('error');$('notice').innerHTML='실시간 데이터 연결에 실패했습니다. 데이터 제공처의 API 주소, CORS 정책 또는 일시적인 장애 때문일 수 있어요. 잠시 후 다시 시도하거나 다른 종목을 선택해 주세요. <br><br>오류: '+String(e.message||e).replace(/</g,'&lt;');$('games').innerHTML='<div class="empty">연결 가능한 경기 데이터가 없습니다. 임의의 점수를 만들어 표시하지 않습니다.</div>'}finally{btn.disabled=false;btn.textContent='경기 불러오기'}}
function render(){const q=$('q').value.trim().toLowerCase();const filtered=allGames.filter(g=>(g.home+' '+g.away+' '+g.league+' '+g.status).toLowerCase().includes(q));$('summary').textContent=filtered.length+'경기 표시'+(q?' (검색 결과)':'');if(!filtered.length){$('games').innerHTML='<div class="empty">이 날짜에 표시할 경기가 없거나 검색 결과가 없습니다.<br>다른 날짜·종목을 선택하거나 검색어를 지워 보세요.</div>';return}$('games').innerHTML=filtered.map(g=>{const status=g.status.replace(/</g,'&lt;');return '<article class="game"><div class="meta"><span>'+g.league.replace(/</g,'&lt;')+'</span><span>'+g.time.replace(/</g,'&lt;')+'</span></div><div class="teams"><div><div class="team">'+g.home.replace(/</g,'&lt;')+'</div><div class="team" style="margin-top:12px">'+g.away.replace(/</g,'&lt;')+'</div></div><div class="score">'+String(g.hs).replace(/</g,'&lt;')+'<br>'+String(g.as).replace(/</g,'&lt;')+'</div></div><div class="status" style="margin-top:14px">'+status+'</div></article>'}).join('')}
$('load').addEventListener('click',load);$('date').addEventListener('change',load);$('sport').addEventListener('change',load);$('q').addEventListener('input',render);load();setInterval(load,60000);
</script></body></html>
