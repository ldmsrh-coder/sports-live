<script>
const $=id=>document.getElementById(id);
const now=new Date(), localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
let selectedDate=localDate, allGames=[], calendarMonth=new Date(now.getFullYear(),now.getMonth(),1), loading=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(obj,keys,fallback=''){for(const k of keys){const v=k.split('.').reduce((a,b)=>a&&a[b],obj);if(v!==undefined&&v!==null&&v!=='')return v}return fallback}
function text(v){if(typeof v==='object'&&v!==null)return v.name||v.title||v.short_name||'';return v==null?'':String(v)}
function ko(s){if(!s)return '';const names={'NBA':'미국 프로농구 NBA','National Basketball Association':'미국 프로농구 NBA','English Premier League':'잉글랜드 프리미어리그','Premier League':'잉글랜드 프리미어리그','LaLiga':'스페인 라리가','Spanish LaLiga':'스페인 라리가','Serie A':'이탈리아 세리에 A','Bundesliga':'독일 분데스리가','Ligue 1':'프랑스 리그 1','UEFA Champions League':'UEFA 챔피언스리그','UEFA Europa League':'UEFA 유로파리그','Major League Soccer':'미국 메이저리그 사커','MLB':'미국 프로야구 MLB','K League 1':'대한민국 K리그 1','K League 2':'대한민국 K리그 2','KBO League':'대한민국 KBO 리그','KBO':'대한민국 KBO 리그','KBL':'대한민국 프로농구 KBL','WKBL':'대한민국 여자프로농구 WKBL','V-League':'대한민국 V리그','New York Knicks':'뉴욕 닉스','Philadelphia 76ers':'필라델피아 세븐티식서스','San Antonio Spurs':'샌안토니오 스퍼스','Oklahoma City Thunder':'오클라호마시티 썬더','Los Angeles Lakers':'LA 레이커스','Los Angeles Clippers':'LA 클리퍼스','Golden State Warriors':'골든스테이트 워리어스','Boston Celtics':'보스턴 셀틱스','Arsenal':'아스널','Manchester City':'맨체스터 시티','Manchester United':'맨체스터 유나이티드','Liverpool':'리버풀','Chelsea':'첼시','Tottenham Hotspur':'토트넘 홋스퍼','Real Madrid':'레알 마드리드','Barcelona':'바르셀로나','Atletico Madrid':'아틀레티코 마드리드','Bayern Munich':'바이에른 뮌헨','Borussia Dortmund':'보루시아 도르트문트','Paris Saint-Germain':'파리 생제르맹','Inter Milan':'인터 밀란','AC Milan':'AC 밀란','Juventus':'유벤투스','Napoli':'나폴리','New York Yankees':'뉴욕 양키스','Los Angeles Dodgers':'LA 다저스','Boston Red Sox':'보스턴 레드삭스'};return names[s]||s}
function formatTime(s){if(!s||s==='시간 미정')return '시간 미정';const d=new Date(s);if(Number.isNaN(d.getTime()))return s;return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)+' KST'}
function drawCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('monthLabel').textContent=y+'. '+String(m+1).padStart(2,'0');$('todayLabel').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeZone:'Asia/Seoul'}).format(now);$('selectedDateLabel').textContent=selectedDate;$('stat-date').textContent=selectedDate===localDate?'오늘':selectedDate;const names=['일','월','화','수','목','금','토'];let html=names.map(n=>'<div class="dow">'+n+'</div>').join('');for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');html+='<button type="button" class="day'+(iso===selectedDate?' selected':'')+(iso===localDate?' today':'')+'" data-date="'+iso+'">'+d+'</button>'}$('calgrid').innerHTML=html;$('calgrid').querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{selectedDate=b.dataset.date;drawCalendar();load()}))}
$('prevMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);drawCalendar()});$('nextMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);drawCalendar()});drawCalendar();
function countryForLeague(league){const s=String(league||'').toLowerCase();if(/k league|kbo|kbl|wkbl|v-league|korea|대한민국|한국/.test(s))return {name:'대한민국',flag:'🇰🇷'};if(/premier league|fa cup|england|english/.test(s))return {name:'잉글랜드',flag:'🏴'};if(/laliga|la liga|spain|spanish/.test(s))return {name:'스페인',flag:'🇪🇸'};if(/serie a|italy|italian/.test(s))return {name:'이탈리아',flag:'🇮🇹'};if(/bundesliga|germany|german/.test(s))return {name:'독일',flag:'🇩🇪'};if(/ligue 1|france|french/.test(s))return {name:'프랑스',flag:'🇫🇷'};if(/nba|wnba|mlb|nfl|nhl|major league soccer|usa|united states/.test(s))return {name:'미국',flag:'🇺🇸'};if(/mexico|liga mx/.test(s))return {name:'멕시코',flag:'🇲🇽'};if(/argentina/.test(s))return {name:'아르헨티나',flag:'🇦🇷'};if(/uefa|champions league|europa league/.test(s))return {name:'유럽 대항전',flag:'🇪🇺'};if(/j league|japan|japan professional/.test(s))return {name:'일본',flag:'🇯🇵'};if(/australia|a-league/.test(s))return {name:'호주',flag:'🇦🇺'};if(/cricket|india|ipl/.test(s))return {name:'인도/국제',flag:'🏏'};return {name:'국가 확인 필요',flag:'🌐'}}
function normalizeESPN(data){return (Array.isArray(data?.events)?data.events:[]).map(e=>{const comp=(e.competitions||[])[0]||{},ts=comp.competitors||[],h=ts.find(t=>t.homeAway==='home')||ts[0]||{},a=ts.find(t=>t.homeAway==='away')||ts[1]||{},st=comp.status||e.status||{},league=text(e.leagues?.[0]?.name||comp.league?.name||'경기 일정'),odds=comp.odds?.[0]||e.odds?.[0]||{},pred=comp.predictor||e.predictor||{},hp=Number(pred.homeTeam?.gameProjection??pred.homeWinPercentage??odds.homeWinPercentage??odds.home_probability),ap=Number(pred.awayTeam?.gameProjection??pred.awayWinPercentage??odds.awayWinPercentage??odds.away_probability);return{home:ko(text(h.team?.displayName||h.team?.name||'홈 팀')),away:ko(text(a.team?.displayName||a.team?.name||'원정 팀')),hs:h.score??'-',as:a.score??'-',league:ko(league),country:countryForLeague(league),homeProb:Number.isFinite(hp)&&hp>0&&hp<=100?hp:null,awayProb:Number.isFinite(ap)&&ap>0&&ap<=100?ap:null,status:text(st.type?.shortDetail||st.type?.description||'일정'),time:formatTime(e.date||'')}})}
const espnLeagues={football:['kor.1','kor.2','eng.1','esp.1','ita.1','ger.1','fra.1','usa.1','mex.1','arg.1','uefa.champions','uefa.europa'],basketball:['nba','wnba','mens-college-basketball','kor.kbl','kor.wkbl'],baseball:['kor.kbo','mlb','college-baseball'],hockey:['nhl'],americanfootball:['nfl','college-football']};
async function fetchESPN(sport,date){const leagues=espnLeagues[sport]||[];const ds=date.replace(/-/g,'');const results=await Promise.allSettled(leagues.map(async league=>{const category=sport==='football'?'soccer':sport==='americanfootball'?'football':sport;const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500);try{const res=await fetch('https://site.api.espn.com/apis/site/v2/sports/'+category+'/'+league+'/scoreboard?dates='+ds,{signal:ctrl.signal,cache:'no-store'});if(!res.ok)throw Error('ESPN '+res.status);return normalizeESPN(await res.json())}finally{clearTimeout(timer)}}));return results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)}
function normalize(raw){let root=raw;for(let i=0;i<4&&root&&typeof root==='object'&&!Array.isArray(root);i++){if(['matches','fixtures','results','events','data'].some(k=>Array.isArray(root[k])))break;root=root.data||root.response||root.result||root.payload||root}const arr=Array.isArray(root)?root:(root&&['matches','fixtures','results','events','data'].map(k=>root[k]).find(Array.isArray))||[];return arr.map(g=>{const home=text(val(g,['home_team.name','home_team','home.name','home','teams.home.name','teams.home','participants.0.name','participants.0','competitors.0.team.displayName','competitors.0.name','homeTeam.name','homeTeam.displayName'],'')),away=text(val(g,['away_team.name','away_team','away.name','away','teams.away.name','teams.away','participants.1.name','participants.1','competitors.1.team.displayName','competitors.1.name','awayTeam.name','awayTeam.displayName'],''));if(!home||!away)return null;let hs=val(g,['home_score.current','home_score','scores.home.current','scores.home','score.home','scores.0.score','result.home','homeScore','competitors.0.score'],'-'),as=val(g,['away_score.current','away_score','scores.away.current','scores.away','score.away','scores.1.score','result.away','awayScore','competitors.1.score'],'-');if(typeof hs==='object')hs=hs.current??hs.goals??hs.score??'-';if(typeof as==='object')as=as.current??as.goals??as.score??'-';let status=text(val(g,['status_text','status.description','status.type.description','status','state','time.status'],'일정'));const sm={Finished:'종료',finished:'종료',Live:'진행 중',live:'진행 중',Scheduled:'예정',scheduled:'예정',Delayed:'지연',Postponed:'연기',Cancelled:'취소','Half Time':'하프타임'};return{home:ko(home),away:ko(away),hs,as,league:ko(text(val(g,['league.name','league','competition.name','competition','tournament.name','tournament','league_name'],'대회 정보 없음'))),status:sm[status]||status,time:formatTime(text(val(g,['time','starting_at','start_time','date','scheduled_at','start_at'],'시간 미정')))}}).filter(Boolean)}
function render(){const q=$('q').value.trim().toLocaleLowerCase();const games=allGames.filter(g=>(g.home+' '+g.away+' '+g.league+' '+(g.country?.name||'')+' '+g.status).toLocaleLowerCase().includes(q));$('summary').textContent=games.length+' 경기 표시';$('stat-count').textContent=games.length+' 경기';if(!games.length){$('games').innerHTML='<div class="empty"><div style="font-size:28px;margin-bottom:8px">◌</div><b>표시할 경기가 없습니다.</b><br>이 날짜에 경기가 없거나 데이터 제공처가 응답하지 않을 수 있습니다.<br>다른 날짜·종목을 선택해 보세요.</div>';return}$('games').innerHTML=games.map(g=>{const country=g.country||countryForLeague(g.league);const probability=Number.isFinite(g.homeProb)&&Number.isFinite(g.awayProb)?'<div class="probability"><div class="prob-head"><span>승리 확률</span><b>'+Math.round(g.homeProb)+'% : '+Math.round(g.awayProb)+'%</b></div><div class="prob-bar"><span style="width:'+Math.max(0,Math.min(100,g.homeProb))+'%"></span><i style="width:'+Math.max(0,Math.min(100,g.awayProb))+'%"></i></div><div class="prob-names"><span>'+esc(g.home)+'</span><span>'+esc(g.away)+'</span></div></div>':'<div class="probability unavailable"><span>승리 확률</span><b>공식 예측 데이터 없음</b><small>확률을 임의로 계산해 표시하지 않습니다.</small></div>';return '<article class="game"><div class="game-meta"><span class="league">'+esc(country.flag)+' &nbsp;'+esc(country.name)+' · '+esc(g.league)+'</span><span class="game-time">'+esc(g.time)+'</span></div><div class="teams"><div><div class="team">'+esc(g.home)+'</div><div class="team">'+esc(g.away)+'</div></div><div class="scores">'+esc(g.hs)+'<br>'+esc(g.as)+'</div></div><span class="status'+(/진행|live|half|하프/i.test(g.status)?' live':'')+'">'+esc(g.status)+'</span>'+probability+'</article>'}).join('')}
async function load(){if(loading)return;loading=true;const btn=$('load'),sport=$('sport').value,date=selectedDate;btn.disabled=true;btn.textContent='불러오는 중…';$('notice').classList.remove('error');$('notice').textContent='경기 데이터를 확인하고 있습니다. 제공처 응답에 따라 시간이 걸릴 수 있습니다.';$('games').innerHTML='<div class="empty">경기 일정을 불러오는 중입니다…</div>';let games=[],source='',errors=[];const fetchJson=async(url,ms=8000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}};try{games=await fetchESPN(sport,date);if(games.length)source='ESPN 일정'}catch(e){errors.push('ESPN 연결 실패')}if(!games.length&&['football','basketball','cricket','tennis'].includes(sport)){try{games=normalize(await fetchJson('https://sportscore.com/api/v1/fixtures/?sport='+encodeURIComponent(sport)+'&date='+encodeURIComponent(date)+'&limit=50'));if(games.length)source='SportScore 일정'}catch(e){errors.push('SportScore 일정 연결 실패')}}if(!games.length&&date===localDate&&['football','basketball','cricket','tennis'].includes(sport)){try{games=normalize(await fetchJson('https://sportscore.com/api/widget/matches/?sport='+encodeURIComponent(sport)+'&limit=50'));if(games.length)source='SportScore 실시간'}catch(e){errors.push('실시간 데이터 연결 실패')}}if(!games.length){try{const cached=JSON.parse(localStorage.getItem('sports-live:'+sport+':'+date)||'null');if(Array.isArray(cached)&&cached.length){games=cached;source='저장된 일정 · 최신 데이터가 아닐 수 있음'}}catch(e){}}allGames=games;if(games.length){try{localStorage.setItem('sports-live:'+sport+':'+date,JSON.stringify(games))}catch(e){}render();$('notice').textContent=source+' · '+date+' · 경기 데이터는 제공처 상태에 따라 일부 누락될 수 있습니다.';$('stat-updated').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});$('stat-date').textContent=date===localDate?'오늘':date}else{$('summary').textContent='일정을 찾지 못했습니다';$('stat-count').textContent='0 경기';$('stat-updated').textContent='연결 확인 필요';$('games').innerHTML='<div class="empty"><div style="font-size:30px;margin-bottom:8px">⌁</div><b>경기 정보를 불러오지 못했습니다.</b><br>잠시 후 다시 시도하거나 다른 종목·날짜를 선택해 보세요.<br>선택한 날짜에 일정이 없거나 제공처가 응답하지 않을 수 있습니다.</div>';$('notice').classList.add('error');$('notice').textContent=errors.length?errors.join(' · '):'선택한 날짜에 공개된 일정이 없습니다.'}btn.disabled=false;btn.textContent='경기 새로고침 ↗';loading=false}
$('load').addEventListener('click',load);$('sport').addEventListener('change',load);$('q').addEventListener('input',render);load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body></html>
