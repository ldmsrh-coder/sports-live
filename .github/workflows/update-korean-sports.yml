name: Update Korean sports snapshot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_korean_sports.py"
      - "scripts/test_update_korean_sports.py"
      - "scripts/test_country_normalization.js"
      - "index.html"
      - "app.js"
      - ".github/workflows/update-korean-sports.yml"

permissions:
  contents: write

concurrency:
  group: korean-sports-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run collector unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Collect current-month Korean sports schedules
        run: python scripts/update_korean_sports.py
      - name: Validate site JavaScript and sports snapshot
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if not Path("app.js").is_file() or not re.search(r'<script src="\./app\.js(?:\?[^\"]*)?"></script>', html):
              raise SystemExit("External application script is missing or not safely cache-busted")
          if re.search(r"<script>(.*?)</script>", html, re.S):
              raise SystemExit("Inline JavaScript is not allowed; keep application code in app.js")
          if '<html lang="ko">' not in html or 'id="qualitySummary"' not in html or 'id="insightPanel"' not in html:
              raise SystemExit("Korean document language, data quality summary, or live analysis panel is missing")
          for tag in re.findall(r"<a[^>]*>", html, re.I):
              normalized_tag = tag.lower().replace("'", '"')
              if 'target="_blank"' in normalized_tag and "noopener" not in normalized_tag:
                  raise SystemExit(f"Unsafe external new-window link: {tag}")
          Path("/tmp/sports-live.js").write_text(Path("app.js").read_text(encoding="utf-8"), encoding="utf-8")
          payload = json.loads(Path("data/korean-sports.json").read_text(encoding="utf-8"))
          games = payload.get("games")
          if not isinstance(games, list) or not games:
              raise SystemExit("Sports snapshot is empty or malformed")
          required = ("date", "home", "away", "league", "sport", "status", "source")
          seen = set()
          for index, game in enumerate(games):
              missing = [key for key in required if not str(game.get(key, "")).strip()]
              if missing:
                  raise SystemExit(f"Game {index} missing fields: {missing}")
              if game["home"] == game["away"]:
                  raise SystemExit(f"Game {index} has identical home and away teams")
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", str(game["date"])):
                  raise SystemExit(f"Game {index} has invalid ISO date: {game['date']}")
              labels = " ".join(str(game.get(k, "")) for k in ("home", "away", "league", "countryName", "country_name"))
              country = game.get("country")
              if isinstance(country, dict):
                  labels += " " + " ".join(str(country.get(k, "")) for k in ("name", "country_name", "displayName"))
              if re.search(r"국가\s*확인\s*필요|국가확인필요|국가미확인|국가미분류|country.*(confirmation|check|verification).*(needed|required|missing)", labels, re.I):
                  raise SystemExit(f"Game {index} contains an unresolved country placeholder")
              key = tuple(str(game.get(k, "")) for k in ("date", "sport", "league", "home", "away", "time"))
              if key in seen:
                  raise SystemExit(f"Duplicate match record at row {index}: {key}")
              seen.add(key)
          print(f"Validated {len(games)} sports records; snapshot updatedAt={payload.get('updatedAt')}")
          PY
      - name: Node syntax check
        run: node --check /tmp/sports-live.js
      - name: Test country placeholder normalization
        run: node scripts/test_country_normalization.js
      - name: Publish changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/korean-sports.json
          if git diff --cached --quiet; then
            echo "No data changes; keeping the existing snapshot."
          else
            git commit -m "Refresh Korean sports data"
            # The site code and scheduled collector can update main close together.
            # Re-fetch/rebase and retry a rejected non-fast-forward push instead of
            # failing a healthy collection run because another commit landed first.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published refreshed sports snapshot."
                exit 0
              fi
              echo "Push raced with another commit; retrying ($attempt/3)."
              sleep $((attempt * 2))
            done
            echo "Could not publish the snapshot after three attempts."
            exit 1
          fi
